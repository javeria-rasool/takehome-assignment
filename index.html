<!DOCTYPE html><html><head><title>Todo List</title><style>body { font-family: Arial, sans-serif; } .todo { margin-bottom: 10px; } .completed { text-decoration: line-through; } </style></head><body><h1>Todo List</h1><input id="new-todo" type="text" placeholder="Enter new todo"><button id="add-todo">Add</button><ul id="todo-list"></ul><script>let todos = JSON.parse(localStorage.getItem('todos')) || []; const todoList = document.getElementById('todo-list'); const newTodoInput = document.getElementById('new-todo'); const addTodoButton = document.getElementById('add-todo'); const remainingCountElement = document.createElement('span'); remainingCountElement.textContent = ` ${todos.filter(todo => !todo.completed).length} remaining`; document.body.appendChild(remainingCountElement); addTodoButton.addEventListener('click', () => { const newTodo = newTodoInput.value.trim(); if (newTodo) { todos.push({ text: newTodo, completed: false }); localStorage.setItem('todos', JSON.stringify(todos)); newTodoInput.value = ''; renderTodoList(); } }); function renderTodoList() { todoList.innerHTML = ''; todos.forEach((todo, index) => { const todoElement = document.createElement('li'); todoElement.classList.add('todo'); const checkbox = document.createElement('input'); checkbox.type = 'checkbox'; checkbox.checked = todo.completed; checkbox.addEventListener('change', () => { todo.completed = checkbox.checked; localStorage.setItem('todos', JSON.stringify(todos)); renderTodoList(); }); const todoText = document.createElement('span'); todoText.textContent = todo.text; todoText.classList.add(todo.completed ? 'completed' : ''); const deleteButton = document.createElement('button'); deleteButton.textContent = 'Delete'; deleteButton.addEventListener('click', () => { todos.splice(index, 1); localStorage.setItem('todos', JSON.stringify(todos)); renderTodoList(); }); todoElement.appendChild(checkbox); todoElement.appendChild(todoText); todoElement.appendChild(deleteButton); todoList.appendChild(todoElement); }); } renderTodoList();</script></body></html>
