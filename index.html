<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo App</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f1f5f9;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;padding:24px 16px}
.card{background:#fff;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,.08);max-width:480px;margin:0 auto;overflow:hidden}
.card-header{padding:20px 24px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between}
h1{font-size:20px;font-weight:700;color:#1e293b}
#remaining{font-size:13px;font-weight:600;background:#ede9fe;color:#4f46e5;padding:4px 12px;border-radius:20px}
.add-row{display:flex;gap:8px;padding:16px 24px;border-bottom:1px solid #e2e8f0}
#new-todo{flex:1;padding:10px 14px;border:1.5px solid #cbd5e1;border-radius:8px;font-size:14px;outline:none;transition:border-color .15s}
#new-todo:focus{border-color:#4f46e5}
#add-btn{background:#4f46e5;color:#fff;border:none;border-radius:8px;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s}
#add-btn:hover{background:#4338ca}
#todo-list{list-style:none}
.todo-item{display:flex;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid #f1f5f9;transition:background .1s}
.todo-item:hover{background:#f8fafc}
.todo-item input[type="checkbox"]{width:18px;height:18px;accent-color:#4f46e5;cursor:pointer;flex-shrink:0}
.todo-text{flex:1;font-size:15px;color:#1e293b;transition:all .15s}
.todo-text.done{text-decoration:line-through;color:#94a3b8}
.del-btn{background:none;border:none;color:#cbd5e1;font-size:20px;cursor:pointer;padding:0 4px;transition:color .15s;flex-shrink:0}
.del-btn:hover{color:#ef4444}
.empty{padding:32px 24px;text-align:center;color:#94a3b8;font-size:14px}
</style>
</head>
<body>
<div class="card">
  <div class="card-header"><h1>My Todos</h1><span id="remaining">0 remaining</span></div>
  <div class="add-row">
    <input id="new-todo" type="text" placeholder="What needs to be done?">
    <button id="add-btn">Add</button>
  </div>
  <ul id="todo-list"></ul>
</div>
<script>
var todos = JSON.parse(localStorage.getItem('todos') || '[]');
function save(){localStorage.setItem('todos',JSON.stringify(todos));}
function render(){
  var list=document.getElementById('todo-list');
  var rem=document.getElementById('remaining');
  list.innerHTML='';
  var inc=todos.filter(function(t){return !t.done;}).length;
  rem.textContent=inc+' remaining';
  if(!todos.length){
    var e=document.createElement('li');e.className='empty';
    e.textContent='No tasks yet — add one above!';list.appendChild(e);return;
  }
  todos.forEach(function(todo,i){
    var li=document.createElement('li');li.className='todo-item';
    var cb=document.createElement('input');cb.type='checkbox';cb.checked=todo.done;
    cb.addEventListener('change',function(){todos[i].done=cb.checked;save();render();});
    var sp=document.createElement('span');sp.className='todo-text';
    if(todo.done){sp.classList.add('done');}
    sp.textContent=todo.text;
    var btn=document.createElement('button');btn.className='del-btn';btn.textContent='×';
    btn.addEventListener('click',function(){todos.splice(i,1);save();render();});
    li.appendChild(cb);li.appendChild(sp);li.appendChild(btn);list.appendChild(li);
  });
}
function addTodo(){
  var inp=document.getElementById('new-todo');
  var text=inp.value.trim();if(!text)return;
  todos.push({text:text,done:false});save();render();inp.value='';
}
document.getElementById('add-btn').addEventListener('click',addTodo);
document.getElementById('new-todo').addEventListener('keydown',function(e){if(e.key==='Enter')addTodo();});
render();
</script>
</body>
</html>
