<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Todo App</title><style>body { font-family: Arial, sans-serif; } .todo { margin-bottom: 10px; } .todo.completed { text-decoration: line-through; } .todo-count { font-size: 12px; color: #666; }</style></head><body><h1>Todo App</h1><input id="new-todo" type="text" placeholder="Enter new todo"><button id="add-todo">Add</button><ul id="todo-list"></ul><p id="todo-count">Remaining: <span id="remaining-count">0</span></p><script src="https://cdn.jsdelivr.net/npm/localstorage-polyfill@1.0.0/dist/localStoragePolyfill.min.js"></script><script>function TodoList() { this.todos = JSON.parse(localStorage.getItem('todos')) || []; this.remainingCount = this.todos.filter(todo => !todo.completed).length; this.render = function() { const todoList = document.getElementById('todo-list'); todoList.innerHTML = ''; this.todos.forEach((todo, index) => { const todoElement = document.createElement('li'); todoElement.classList.add('todo'); todoElement.innerHTML = `<span>${todo.text}</span><button class="delete" data-index="${index}">Delete</button><button class="complete" data-index="${index}">Complete</button>`; todoList.appendChild(todoElement); }); document.getElementById('remaining-count').textContent = this.remainingCount; }; this.addTodo = function(text) { this.todos.push({ text, completed: false }); localStorage.setItem('todos', JSON.stringify(this.todos)); this.render(); }; this.completeTodo = function(index) { this.todos[index].completed = true; localStorage.setItem('todos', JSON.stringify(this.todos)); this.render(); this.remainingCount = this.todos.filter(todo => !todo.completed).length; }; this.deleteTodo = function(index) { this.todos.splice(index, 1); localStorage.setItem('todos', JSON.stringify(this.todos)); this.render(); this.remainingCount = this.todos.filter(todo => !todo.completed).length; }; this.render(); document.getElementById('add-todo').addEventListener('click', () => { const newTodoInput = document.getElementById('new-todo'); const newText = newTodoInput.value.trim(); if (newText) { this.addTodo(newText); newTodoInput.value = ''; } }); document.addEventListener('click', event => { if (event.target.classList.contains('delete')) { const index = event.target.dataset.index; this.deleteTodo(index); } else if (event.target.classList.contains('complete')) { const index = event.target.dataset.index; this.completeTodo(index); } }); } const todoList = new TodoList();</script></body></html>
