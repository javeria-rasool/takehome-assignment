<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .todo-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .todo-item {
            padding: 10px;
            border-bottom: 1px solid #ccc;
        }
        .todo-item.completed {
            text-decoration: line-through;
            color: #666;
        }
        .todo-item.delete {
            background-color: #f00;
            color: #fff;
            cursor: pointer;
        }
        .todo-item.delete:hover {
            background-color: #ff0000;
        }
        .remaining-count {
            font-weight: bold;
            color: #006;
        }
    </style>
</head>
<body>
    <h1>Todo App</h1>
    <input id="new-todo" type="text" placeholder="Enter new todo item">
    <button id="add-todo">Add</button>
    <ul id="todo-list" class="todo-list"></ul>
    <p id="remaining-count" class="remaining-count"></p>
    <script>
        let todos = JSON.parse(localStorage.getItem('todos')) || [];
        const newTodoInput = document.getElementById('new-todo');
        const addTodoButton = document.getElementById('add-todo');
        const todoList = document.getElementById('todo-list');
        const remainingCount = document.getElementById('remaining-count');

        addTodoButton.addEventListener('click', () => {
            const newTodo = newTodoInput.value.trim();
            if (newTodo) {
                todos.push({ text: newTodo, completed: false });
                localStorage.setItem('todos', JSON.stringify(todos));
                renderTodos();
                newTodoInput.value = '';
            }
        });

        function renderTodos() {
            todoList.innerHTML = '';
            todos.forEach((todo, index) => {
                const todoItem = document.createElement('li');
                todoItem.classList.add('todo-item');
                if (todo.completed) {
                    todoItem.classList.add('completed');
                }
                todoItem.innerHTML = `
                    <span>${todo.text}</span>
                    <button class="delete" onclick="deleteTodo(${index})">Delete</button>
                `;
                todoList.appendChild(todoItem);
            });
            remainingCount.textContent = todos.filter(todo => !todo.completed).length;
        }

        function deleteTodo(index) {
            todos.splice(index, 1);
            localStorage.setItem('todos', JSON.stringify(todos));
            renderTodos();
        }

        function toggleCompleted(index) {
            todos[index].completed = !todos[index].completed;
            localStorage.setItem('todos', JSON.stringify(todos));
            renderTodos();
        }

        renderTodos();
    </script>
</body>
</html>
