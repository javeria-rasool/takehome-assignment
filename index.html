<!DOCTYPE html><html><head><title>Todo App</title><style>body { background-color: #f7f7f7; } .container { max-width: 480px; margin: 40px auto; padding: 24px; border-radius: 12px; background-color: #fff; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); } .header { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid #ddd; } .input-row { display: flex; align-items: center; padding: 16px; border-bottom: 1px solid #ddd; } .input-row input { flex-grow: 1; padding: 12px; border: none; border-radius: 12px 0 0 12px; } .input-row button { background-color: #4f46e5; color: #fff; padding: 12px 16px; border: none; border-radius: 0 12px 12px 0; cursor: pointer; } .todo-item { display: flex; align-items: center; padding: 16px; border-bottom: 1px solid #ddd; } .todo-item input { margin-right: 16px; } .todo-item span { flex-grow: 1; } .todo-item button { background-color: #ef4444; color: #fff; padding: 8px 12px; border: none; border-radius: 12px; cursor: pointer; } .todo-item button:hover { background-color: #dc2626; } .completed { text-decoration: line-through; color: #666; } .remaining-count { font-size: 24px; font-weight: bold; margin-bottom: 16px; }</style></head><body><div class="container"><div class="header"><h1>Todo App</h1><span id="remaining-count">0 tasks remaining</span></div><div class="input-row"><input id="todo-input" type="text" placeholder="Add new todo"><button id="add-button">Add</button></div><ul id="todo-list"></ul></div><script>const todos = JSON.parse(localStorage.getItem('todos')) || [];function render() { const todoList = document.getElementById('todo-list'); todoList.innerHTML = ''; todos.forEach((todo, index) => { const listItem = document.createElement('LI'); const checkbox = document.createElement('INPUT'); checkbox.type = 'checkbox'; checkbox.checked = todo.completed; checkbox.addEventListener('change', () => { todo.completed = checkbox.checked; localStorage.setItem('todos', JSON.stringify(todos)); render(); }); const text = document.createElement('SPAN'); text.textContent = todo.text; text.classList.add(todo.completed ? 'completed' : ''); const deleteButton = document.createElement('BUTTON'); deleteButton.textContent = 'Delete'; deleteButton.addEventListener('click', () => { todos.splice(index, 1); localStorage.setItem('todos', JSON.stringify(todos)); render(); }); listItem.appendChild(checkbox); listItem.appendChild(text); listItem.appendChild(deleteButton); todoList.appendChild(listItem); }); const remainingCount = document.getElementById('remaining-count'); remainingCount.textContent = todos.filter(t => !t.completed).length + ' tasks remaining';}render();document.getElementById('add-button').addEventListener('click', () => { const todoInput = document.getElementById('todo-input'); const todoText = todoInput.value.trim(); if (todoText) { todos.push({ text: todoText, completed: false }); localStorage.setItem('todos', JSON.stringify(todos)); todoInput.value = ''; render(); }});document.getElementById('todo-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') { document.getElementById('add-button').click(); }});</script></body></html>
