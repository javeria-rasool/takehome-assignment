<!DOCTYPE html><html><head><title>Todo App</title><style>body { font-family: Arial, sans-serif; } .todo { margin-bottom: 10px; } .completed { text-decoration: line-through; } </style></head><body><h1>Todo List</h1><input id='new-todo' type='text'><button id='add-btn'>Add</button><ul id='todo-list'></ul><script>let todos = JSON.parse(localStorage.getItem('todos')) || []; const list = document.getElementById('todo-list'); const newTodoInput = document.getElementById('new-todo'); const addBtn = document.getElementById('add-btn'); let remainingItems = todos.filter(t => !t.completed).length; function render() { list.innerHTML = ''; todos.forEach((todo, index) => { const li = document.createElement('li'); li.textContent = todo.text; if (todo.completed) { li.classList.add('completed'); } const checkbox = document.createElement('input'); checkbox.type = 'checkbox'; checkbox.checked = todo.completed; checkbox.addEventListener('change', () => { todos[index].completed = checkbox.checked; localStorage.setItem('todos', JSON.stringify(todos)); render(); }); li.appendChild(checkbox); list.appendChild(li); }); document.getElementById('remaining-items').textContent = `Remaining: ${remainingItems}`; } function addTodo() { const newTodoText = newTodoInput.value.trim(); if (newTodoText) { todos.push({ text: newTodoText, completed: false }); localStorage.setItem('todos', JSON.stringify(todos)); newTodoInput.value = ''; render(); } } addBtn.addEventListener('click', addTodo); newTodoInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { addTodo(); } }); list.addEventListener('click', (e) => { if (e.target.tagName === 'INPUT' && e.target.type === 'checkbox') { const todoIndex = todos.findIndex(t => t.text === e.target.parentNode.textContent); todos[todoIndex].completed = e.target.checked; localStorage.setItem('todos', JSON.stringify(todos)); render(); } }); list.addEventListener('click', (e) => { if (e.target.tagName === 'LI') { const todoIndex = todos.findIndex(t => t.text === e.target.textContent); todos.splice(todoIndex, 1); localStorage.setItem('todos', JSON.stringify(todos)); render(); } }); render();</script><p id='remaining-items'>Remaining: 0</p></body></html>
