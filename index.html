<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Todo App</title><style>body { font-family: Arial, sans-serif; } .todo-list { list-style: none; padding: 0; margin: 0; } .todo-list li { padding: 10px; border-bottom: 1px solid #ccc; } .todo-list li:last-child { border-bottom: none; } .todo-list li.completed { text-decoration: line-through; color: #666; } .todo-list li button { float: right; background-color: #f00; color: #fff; border: none; padding: 5px 10px; cursor: pointer; } .todo-list li button:hover { background-color: #ff3333; } #todo-input { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ccc; } #todo-button { background-color: #4CAF50; color: #fff; padding: 10px 20px; border: none; cursor: pointer; } #todo-button:hover { background-color: #3e8e41; } #remaining-todos { font-size: 18px; font-weight: bold; }</style></head><body><h1>Todo App</h1><input id="todo-input" type="text" placeholder="Add new todo item"><button id="todo-button">Add</button><ul id="todo-list" class="todo-list"></ul><p id="remaining-todos">0 remaining</p><script>let todos = JSON.parse(localStorage.getItem('todos')) || [];const todoList = document.getElementById('todo-list');const todoInput = document.getElementById('todo-input');const todoButton = document.getElementById('todo-button');const remainingTodos = document.getElementById('remaining-todos');todoButton.addEventListener('click', addTodo);todoList.addEventListener('click', handleTodoClick);function addTodo() { const newTodo = { text: todoInput.value, completed: false }; todos.push(newTodo); saveTodos(); renderTodos(); todoInput.value = ''; } function handleTodoClick(event) { if (event.target.tagName === 'BUTTON') { const todoIndex = event.target.dataset.index; todos[todoIndex].completed = !todos[todoIndex].completed; saveTodos(); renderTodos(); } else if (event.target.tagName === 'LI') { const todoIndex = event.target.dataset.index; todos.splice(todoIndex, 1); saveTodos(); renderTodos(); } } function saveTodos() { localStorage.setItem('todos', JSON.stringify(todos)); } function renderTodos() { todoList.innerHTML = ''; todos.forEach((todo, index) => { const todoItem = document.createElement('li'); todoItem.dataset.index = index; if (todo.completed) { todoItem.classList.add('completed'); } const todoText = document.createTextNode(todo.text); const deleteButton = document.createElement('button'); deleteButton.textContent = 'Delete'; deleteButton.dataset.index = index; deleteButton.addEventListener('click', () => { todos.splice(index, 1); saveTodos(); renderTodos(); }); todoItem.appendChild(todoText); todoItem.appendChild(deleteButton); todoList.appendChild(todoItem); }); remainingTodos.textContent = `${todos.filter(todo => !todo.completed).length} remaining`; }</script></body></html>
