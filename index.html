<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Todo App</title><style>body { font-family: Arial, sans-serif; } .todo { margin-bottom: 10px; } .todo.done { text-decoration: line-through; } .todo-count { font-size: 18px; }</style></head><body><h1>Todo App</h1><input id="new-todo" type="text" placeholder="Enter new todo"><button id="add-todo">Add</button><ul id="todo-list"></ul><p id="todo-count">Remaining: <span id="remaining-count">0</span></p><script src="https://cdn.jsdelivr.net/npm/localstorage-polyfill@1.0.1/dist/localStoragePolyfill.min.js"></script><script>const todoList = document.getElementById('todo-list');const newTodoInput = document.getElementById('new-todo');const addTodoButton = document.getElementById('add-todo');const remainingCountSpan = document.getElementById('remaining-count');let todos = JSON.parse(localStorage.getItem('todos')) || [];function renderTodos() {todoList.innerHTML = '';todos.forEach((todo, index) => {const todoElement = document.createElement('li');todoElement.textContent = todo.text;todoElement.classList.add('todo');if (todo.done) {todoElement.classList.add('done');}todoElement.addEventListener('click', () => {todo.done = !todo.done;localStorage.setItem('todos', JSON.stringify(todos));renderTodos();});todoList.appendChild(todoElement);});remainingCountSpan.textContent = todos.filter(todo => !todo.done).length;}renderTodos();addTodoButton.addEventListener('click', () => {const newTodoText = newTodoInput.value.trim();if (newTodoText) {todos.push({text: newTodoText, done: false});localStorage.setItem('todos', JSON.stringify(todos));newTodoInput.value = '';renderTodos();}});</script></body></html>
